<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1450" viewBox="0 0 1200 1450">
<rect width="100%" height="100%" fill="white"/>
<text x="600" y="55.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#25384B">图4  运动问卷的条件跳转与改答处理</text>
<text x="600" y="100.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="400" fill="#53677A">按原题号展示；跳过题目不参与本次必答校验和答案保存</text>
<polygon points="430,145 685,225 430,305 175,225" fill="#EAF4FE" stroke="#79A8D0" stroke-width="2"/>
<text x="430" y="218.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#25384B">Q1  是否参加运动？</text>
<text x="430" y="257.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#53677A">必答单选</text>
<polyline points="430,305 430,385" fill="none" stroke="#60778A" stroke-width="2.4"/>
<polygon points="430,385 424.345448056554,373.2941876694152 435.654551943446,373.2941876694152" fill="#60778A" stroke="#60778A" stroke-width="2"/>
<text x="475" y="354.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="400" fill="#25384B">参加</text>
<polygon points="430,385 685,470 430,555 175,470" fill="#EAF4FE" stroke="#79A8D0" stroke-width="2"/>
<text x="430" y="460.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#25384B">Q2  喜欢哪些运动？</text>
<text x="430" y="505.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#53677A">必答多选，选择1—2项</text>
<polyline points="430,555 430,675" fill="none" stroke="#60778A" stroke-width="2.4"/>
<polygon points="430,675 424.345448056554,663.2941876694152 435.654551943446,663.2941876694152" fill="#60778A" stroke="#60778A" stroke-width="2"/>
<text x="430" y="617.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="400" fill="#25384B">未命中跳转规则</text>
<rect x="215" y="675" width="430" height="105" rx="14" fill="#FFFFFF" stroke="#79A8D0" stroke-width="2"/>
<text x="430" y="720.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#25384B">Q3  活动建议</text>
<text x="430" y="760.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#53677A">可选文本，最多10个字符</text>
<polyline points="430,780 430,900" fill="none" stroke="#60778A" stroke-width="2.4"/>
<polygon points="430,900 424.345448056554,888.2941876694152 435.654551943446,888.2941876694152" fill="#60778A" stroke="#60778A" stroke-width="2"/>
<rect x="215" y="900" width="430" height="115" rx="14" fill="#ECF6F0" stroke="#78AA91" stroke-width="2"/>
<text x="430" y="948.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#25384B">Q4  年龄</text>
<text x="430" y="990.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#25384B">必答整数，0—120</text>
<polyline points="685,225 990,225 990,955 645,955" fill="none" stroke="#7F6A32" stroke-width="2.4"/>
<polygon points="645,955 656.7058123305848,949.345448056554 656.7058123305848,960.654551943446" fill="#7F6A32" stroke="#7F6A32" stroke-width="2"/>
<text x="1010" y="355.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#25384B">不参加</text>
<text x="1010" y="400.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#25384B">跳过Q2、Q3</text>
<polyline points="685,470 800,470 800,955 645,955" fill="none" stroke="#386D94" stroke-width="2.4"/>
<polygon points="645,955 656.7058123305848,949.345448056554 656.7058123305848,960.654551943446" fill="#386D94" stroke="#386D94" stroke-width="2"/>
<text x="807" y="648.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="400" fill="#25384B">同时包含</text>
<text x="807" y="691.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#25384B">篮球和游泳</text>
<text x="807" y="734.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#25384B">跳过Q3</text>
<polyline points="430,1015 430,1090" fill="none" stroke="#60778A" stroke-width="2.4"/>
<polygon points="430,1090 424.345448056554,1078.2941876694151 435.654551943446,1078.2941876694151" fill="#60778A" stroke="#60778A" stroke-width="2"/>
<rect x="215" y="1090" width="430" height="105" rx="14" fill="#FFFFFF" stroke="#78AA91" stroke-width="2"/>
<text x="430" y="1135.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#25384B">Q5  手机号</text>
<text x="430" y="1175.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#53677A">可选，填写时须为整数</text>
<polyline points="430,1195 430,1270" fill="none" stroke="#60778A" stroke-width="2.4"/>
<polygon points="430,1270 424.345448056554,1258.2941876694151 435.654551943446,1258.2941876694151" fill="#60778A" stroke="#60778A" stroke-width="2"/>
<rect x="215" y="1270" width="430" height="80" rx="14" fill="#FFF5D7" stroke="#C5A34D" stroke-width="2"/>
<text x="430" y="1320.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#25384B">确认并提交</text>
<rect x="755" y="1080" width="390" height="265" rx="14" fill="#F2EEFA" stroke="#A393C7" stroke-width="2"/>
<text x="950" y="1130.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#25384B">返回修改前题时</text>
<text x="950" y="1180.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" fill="#25384B">重新计算实际路径</text>
<text x="950" y="1219.96" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" fill="#25384B">清理失效分支答案</text>
<text x="950" y="1259.92" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" fill="#25384B">保留仍有效的回答</text>
<text x="600" y="1410.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#53677A">规则仅向后跳转；返回改答属于页面操作，不是规则向前跳转。</text>
</svg>